<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A card for Emma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Nunito:wght@600;700;800&display=swap">
<style>
:root{--night:#0d1230;--gold:#ffd27f;--ink:#2a2244;--paper:#fffaf3;--rose:#a2405a;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 30%,#2b2152,#0d1230 70%);display:grid;place-items:center;font-family:Nunito,system-ui,sans-serif;
  padding:24px max(16px,env(safe-area-inset-left,0px));box-sizing:border-box;overflow-x:hidden}
.card{position:relative;width:min(440px,100%);aspect-ratio:4/5.7;border-radius:22px;overflow:hidden;background:var(--paper);color:var(--ink);
  box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 6px rgba(255,210,127,.18)}
.scene{position:absolute;inset:0 0 auto 0;height:47%}
.scene svg{width:100%;height:100%;display:block}
.flakes{position:absolute;inset:0 0 auto 0;height:47%;pointer-events:none;overflow:hidden}
.flakes i{position:absolute;top:-8px;width:5px;height:5px;border-radius:50%;background:#fff;opacity:.85;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(240px) translateX(14px)}}
.txt{position:absolute;inset:42% 0 0 0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:18px 26px 22px;gap:6px}
.to{font-family:Caveat,cursive;font-size:30px;color:var(--rose);margin:0}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:600;font-size:clamp(26px,7vw,34px);line-height:1.05;margin:0;text-wrap:balance}
.when{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#7a6a9a;margin:4px 0 6px}
.row{display:flex;align-items:center;gap:16px;margin-top:auto}
.btn{display:inline-block;text-decoration:none;background:#c8333f;color:#fff;font-weight:800;font-size:16px;padding:13px 20px;border-radius:999px;
  box-shadow:0 8px 20px rgba(200,51,63,.35),inset 0 -3px 0 rgba(0,0,0,.15);animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 8px 30px rgba(255,180,90,.65),inset 0 -3px 0 rgba(0,0,0,.15)}}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.qr{width:92px;text-align:center;font-family:Caveat,cursive;font-size:17px;color:#6d6488}
.qr svg{width:92px;height:92px;display:block;background:#fff;padding:6px;border-radius:10px;box-shadow:0 0 0 1px #eadfd3;box-sizing:border-box}
.sign{font-family:Caveat,cursive;font-size:24px;color:var(--rose);margin-top:8px}
@media (prefers-reduced-motion:reduce){.flakes i,.btn{animation:none}}
</style></head><body>
